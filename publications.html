<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Publications — Dr. Mihael Cudic</title>
  <link rel="stylesheet" href="style.css"/>
  <style>
    /* Override page-header to include filter bar inline */
    .page-header {
      flex-wrap: wrap;
      gap: 0;
      align-items: stretch;
      padding: 0;
      border-bottom: none;
    }

    .pub-header-left {
      display: flex;
      align-items: center;
      gap: 2rem;
      padding: 1.25rem 3rem;
      border-bottom: var(--border);
      flex-shrink: 0;
    }

    .pub-controls {
      flex: 1;
      border-bottom: var(--border);
      position: relative;
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      justify-content: center;
    }

    .pub-controls::before {
      content: '';
      position: absolute;
      left: 0;
      top: 20%;
      height: 60%;
      width: 1.5px;
      background: var(--black);
    }

    .filter-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: nowrap;
      overflow-x: auto;
    }

    .filter-label {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--mid);
      min-width: 48px;
    }

    .filter-btn {
      background: none;
      border: 1px solid var(--black);
      padding: 0.2rem 0.65rem;
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      color: var(--mid);
      transition: all 0.15s;
    }

    .filter-btn:hover { background: var(--light); color: var(--black); }

    .topic-btn.active {
      background: var(--accent);
      color: var(--white);
      border-color: var(--accent);
    }

    .type-btn.active {
      background: var(--black);
      color: var(--white);
    }

    .first-author-btn.active {
      background: #1a5a8b;
      color: var(--white);
      border-color: #1a5a8b;
    }

    .filter-divider {
      width: 100%;
      height: 1px;
      background: rgba(0,0,0,0.08);
    }

    .pub-count {
      font-size: 0.62rem;
      letter-spacing: 0.08em;
      color: var(--mid);
      margin-left: auto;
      white-space: nowrap;
    }

    .pub-summary {
      border-left: var(--border);
      border-bottom: var(--border);
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 0.5rem;
      width: 320px;
      flex-shrink: 0;
      flex-grow: 0;
      overflow: hidden;
    }

    .pub-summary-count {
      font-family: 'Cormorant Garamond', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--black);
      line-height: 1;
    }

    .pub-summary-count span {
      font-size: 0.65rem;
      font-family: 'DM Mono', monospace;
      font-weight: 400;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--mid);
      margin-left: 0.3rem;
    }

    .pub-summary-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.3rem;
      min-height: 1.4rem;
    }

    .summary-tag {
      font-size: 0.55rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.2rem 0.5rem;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .summary-and {
      font-size: 0.52rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--mid);
    }

    @media (max-width: 1100px) {
      .pub-summary { display: none; }
    }

    @media (max-width: 860px) {
      .pub-header-left { border-bottom: var(--border); }
      .pub-controls { border-left: none; border-bottom: var(--border); }
      .page-header { flex-direction: column; }
    }

    .year-group { border-bottom: var(--border); }

    .year-label {
      padding: 0.75rem 3rem;
      background: var(--light);
      border-bottom: 1px solid rgba(0,0,0,0.08);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: -0.01em;
    }

    .pub-row {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 2rem;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid var(--light);
      transition: background 0.15s;
    }

    .pub-row:last-child { border-bottom: none; }
    .pub-row:hover { background: var(--light); }
    .pub-row.hidden { display: none; }

    .pub-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.1rem;
      font-weight: 600;
      line-height: 1.35;
      margin-bottom: 0.3rem;
    }

    .pub-title a {
      text-decoration: none;
      color: var(--black);
      transition: color 0.15s;
    }

    .pub-title a:hover { color: var(--accent); }

    .pub-meta {
      font-size: 0.75rem;
      color: var(--mid);
      line-height: 1.6;
    }

    .pub-meta strong { color: var(--black); font-weight: 600; }
    .pub-meta .venue { font-style: italic; }

    .pub-tags {
      display: flex;
      flex-direction: row;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 0.35rem;
      justify-content: flex-end;
    }

    .pub-tag {
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border: 1px solid currentColor;
      white-space: nowrap;
    }

    .pub-tag.journal     { color: var(--black); }
    .pub-tag.conference  { color: #23627a; border-color: #23627a; }
     .pub-tag.preprint    { color: #6b7280; border-color: #6b7280; }
    .pub-tag.chapter        { color: #5a3b8b; border-color: #5a3b8b; }
    .pub-tag.topic-tag   { font-size: 0.56rem; color: var(--accent); border-color: var(--accent); opacity: 0.75; }

    @media (max-width: 768px) {
      .pub-controls { padding: 1rem 1.25rem; }
      .pub-row { grid-template-columns: 1fr; padding: 1.25rem; gap: 0.75rem; }
      .year-label { padding: 0.5rem 1.25rem; }
      .pub-tags { flex-direction: row; flex-wrap: wrap; align-items: flex-start; }
    }
  </style>
</head>
<body>
<div class="page">

  <div class="page-header">
    <div class="pub-header-left">
      <h1>Publications</h1>
    </div>

    <div class="pub-summary" id="pub-summary">
      <div class="pub-summary-count" id="pub-summary-count">—<span>total publications</span></div>
      <div class="pub-summary-tags" id="pub-summary-tags"></div>
    </div>

    <div class="pub-controls">
      <div class="filter-row">
        <span class="filter-label" style="color:var(--black);font-weight:500;min-width:64px;">Filter By</span>
        <span class="filter-label">Topic:</span>
        <button class="filter-btn topic-btn active" data-topic="all">All</button>
        <button class="filter-btn topic-btn" data-topic="AI">AI</button>
        <button class="filter-btn topic-btn" data-topic="Genetics">Genetics</button>
        <button class="filter-btn topic-btn" data-topic="Epidemiology">Epidemiology</button>
        <button class="filter-btn topic-btn" data-topic="Psychiatry">Psychiatry</button>
        <button class="filter-btn topic-btn" data-topic="Neuroscience">Neuroscience</button>
      </div>
      <div class="filter-divider"></div>
      <div class="filter-row">
        <span class="filter-label" style="min-width:64px;visibility:hidden;">Filter By</span>
        <span class="filter-label">Type:</span>
        <button class="filter-btn type-btn active" data-type="all">All</button>
        <button class="filter-btn type-btn" data-type="journal">Journal</button>
         <button class="filter-btn type-btn" data-type="conference">Conference</button>
        <button class="filter-btn type-btn" data-type="preprint">Preprint</button>
        <button class="filter-btn type-btn" data-type="chapter">Chapter</button>
        <span style="color:var(--mid);opacity:0.4;font-size:0.8rem;margin:0 0.25rem;">|</span>
        <button class="filter-btn first-author-btn" data-firstauthor="true">First Author</button>
      </div>
    </div>
  </div>

  <div id="pub-list"></div>

</div>

<script src="nav.js"></script>
<script>
// publications.bib is the single source of truth for this page.
// Supports BibTeX records with nested brace values, quoted values, and custom fields.
function parseBibTeX(source) {
  const records = [];
  let i = 0;
  const n = source.length;
  const space = () => { while (i < n && /\s/.test(source[i])) i++; };
  const readValue = () => {
    space();
    if (source[i] === '{' || source[i] === '"') {
      const quote = source[i++];
      if (quote === '"') {
        let result = '';
        while (i < n && source[i] !== '"') {
          if (source[i] === '\\' && i + 1 < n) result += source[i++];
          result += source[i++];
        }
        if (source[i] === '"') i++;
        return result.trim();
      }
      let depth = 1, result = '';
      while (i < n && depth > 0) {
        const c = source[i++];
        if (c === '\\' && i < n) { result += c + source[i++]; continue; }
        if (c === '{') depth++;
        else if (c === '}') depth--;
        if (depth > 0) result += c;
      }
      return result.trim();
    }
    const begin = i;
    while (i < n && !/[\s,}]/.test(source[i])) i++;
    return source.slice(begin, i).trim();
  };
  while (i < n) {
    if (source[i] === '%') { while (i < n && source[i] !== '\n') i++; continue; }
    if (source[i] !== '@') { i++; continue; }
    i++; space();
    const typeStart = i;
    while (i < n && /[a-z]/i.test(source[i])) i++;
    const entryType = source.slice(typeStart, i).toLowerCase();
    space();
    if (source[i] !== '{' && source[i] !== '(') continue;
    const closer = source[i++] === '{' ? '}' : ')';
    space();
    if (['comment', 'preamble', 'string'].includes(entryType)) {
      // Skip BibTeX directives, not publication entries.
      let depth = 1;
      while (i < n && depth) {
        if (source[i] === '{') depth++;
        if (source[i] === '}') depth--;
        i++;
      }
      continue;
    }
    const keyStart = i;
    while (i < n && source[i] !== ',' && source[i] !== closer) i++;
    const record = { entryType, key: source.slice(keyStart, i).trim() };
    if (source[i] === ',') i++;
    while (i < n) {
      space();
      if (source[i] === closer) { i++; break; }
      if (source[i] === ',') { i++; continue; }
      if (source[i] === '%') { while (i < n && source[i] !== '\n') i++; continue; }
      const fieldStart = i;
      while (i < n && /[\w-]/.test(source[i])) i++;
      if (fieldStart === i) { i++; continue; }
      const field = source.slice(fieldStart, i).toLowerCase();
      space();
      if (source[i] !== '=') continue;
      i++;
      record[field] = readValue();
      space();
      if (source[i] === ',') i++;
    }
    if (record.title) records.push(record);
  }
  return records;
}

function escapeHTML(value) {
  return String(value ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  })[c]);
}

function publicationFromBib(entry) {
  const type = (entry.pubtype || ({
    inproceedings: 'conference', incollection: 'chapter', article: 'journal'
  })[entry.entryType] || 'journal').toLowerCase();
  // Prefer the short website-specific author string, then use the canonical author list.
  const display = entry.displayauthors || (entry.author || '').split(/\s+and\s+/i).map(a => {
    const parts = a.replace(/[{}]/g, '').split(',');
    if (parts.length > 1) return `${parts[1].trim().charAt(0)}. ${parts[0].trim()}`;
    return parts[0].trim();
  }).join(', ');
  return {
    year: parseInt(entry.year, 10) || 0,
    title: entry.title.replace(/[{}]/g, ''),
    authors: escapeHTML(display).replace(/\bM\. Cudic\b/g, '<strong>M. Cudic</strong>'),
    venue: entry.journal || entry.series || entry.booktitle || entry.publisher || '',
    tag: type,
    topics: (entry.topic || '').split(',').map(t => t.trim()).filter(Boolean),
    firstAuthor: entry.firstauthor ? entry.firstauthor.toLowerCase() === 'true' : /^Cudic\s*,\s*Mihael/i.test(entry.author || ''),
    url: entry.url || (entry.doi ? `https://doi.org/${entry.doi}` : ''),
    sortOrder: Number(entry.sortorder) || Number.MAX_SAFE_INTEGER
  };
}

async function loadPublications() {
  const container = document.getElementById('pub-list');
  container.textContent = 'Loading publications…';
  try {
    const response = await fetch('publications.bib', { cache: 'no-cache' });
    if (!response.ok) throw new Error(`HTTP ${response.status}`);
    const entries = parseBibTeX(await response.text());
    if (!entries.length) throw new Error('No publication entries were found.');
    const publications = entries.map(publicationFromBib).sort((a, b) =>
      b.year - a.year || a.sortOrder - b.sortOrder || a.title.localeCompare(b.title));
    container.textContent = '';
    renderPublications(publications);
  } catch (error) {
    console.error('Unable to load publications.bib:', error);
    container.innerHTML = '<div class="pub-row">Could not load publications.bib. Place it beside publications.html and open the site via a web server (not file://).</div>';
  }
}

let activeTopics = new Set(['all']);
let activeType = 'all';
let filterFirstAuthor = false;

function renderPublications(pubs) {
  const container = document.getElementById('pub-list');
  container.replaceChildren();
  const byYear = {};
  pubs.forEach(p => {
    if (!byYear[p.year]) byYear[p.year] = [];
    byYear[p.year].push(p);
  });

  Object.keys(byYear).sort((a, b) => b - a).forEach(year => {
    const group = document.createElement('div');
    group.className = 'year-group';
    group.innerHTML = `<div class="year-label">${year}</div>`;

    byYear[year].forEach(p => {
      const row = document.createElement('div');
      row.className = 'pub-row';
      row.dataset.tag = p.tag;
      row.dataset.topics = JSON.stringify(p.topics || []);
      row.dataset.firstauthor = p.firstAuthor ? 'true' : 'false';

      const titleHTML = p.url
        ? `<a href="${escapeHTML(p.url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(p.title)}</a>`
        : escapeHTML(p.title);

      const topicPills = (p.topics || []).map(t =>
        `<span class="pub-tag topic-tag">${escapeHTML(t)}</span>`
      ).join('');

      row.innerHTML = `
        <div>
          <div class="pub-title">${titleHTML}</div>
          <div class="pub-meta">
            ${p.authors}<br>
            <span class="venue">${escapeHTML(p.venue)}</span>
          </div>
        </div>
        <div class="pub-tags">
          <span class="pub-tag ${escapeHTML(p.tag)}">${escapeHTML(p.tag)}</span>
          ${topicPills}
        </div>`;

      group.appendChild(row);
    });

    container.appendChild(group);
  });

  applyFilters();
}

function applyFilters() {
  document.querySelectorAll('.pub-row').forEach(row => {
    const rowTopics = JSON.parse(row.dataset.topics || '[]');
    const rowType = row.dataset.tag;
    const rowFirstAuthor = row.dataset.firstauthor === 'true';
    const topicMatch = activeTopics.has('all') || [...activeTopics].every(t => rowTopics.includes(t));
    const typeMatch = activeType === 'all' || rowType === activeType;
    const firstAuthorMatch = !filterFirstAuthor || rowFirstAuthor;
    row.classList.toggle('hidden', !(topicMatch && typeMatch && firstAuthorMatch));
  });

  document.querySelectorAll('.year-group').forEach(g => {
    const anyVisible = [...g.querySelectorAll('.pub-row')].some(r => !r.classList.contains('hidden'));
    g.style.display = anyVisible ? '' : 'none';
  });

  updateCount();
}

function updateCount() {
  const visible = document.querySelectorAll('.pub-row:not(.hidden)').length;
  // Summary panel
  const total = document.querySelectorAll('.pub-row').length;
  const isFiltered = !activeTopics.has('all') || activeType !== 'all' || filterFirstAuthor;
  const label = isFiltered ? 'selected publications' : 'total publications';
  document.getElementById('pub-summary-count').innerHTML =
    `${visible}<span>${label}</span>`;

  const tags = [];
  const topicColors = { AI: 'var(--accent)', Genetics: '#2a7a4b', Epidemiology: '#c47d10', Psychiatry: '#6b3fa0', Neuroscience: '#1a5a8b' };
  if (!activeTopics.has('all')) {
    [...activeTopics].forEach(t => tags.push({ label: t, color: topicColors[t] || 'var(--accent)' }));
  }
  if (activeType !== 'all') {
    tags.push({ label: activeType, color: 'var(--black)' });
  }
  if (filterFirstAuthor) {
    tags.push({ label: 'First Author', color: '#1a5a8b' });
  }

  const tagsEl = document.getElementById('pub-summary-tags');
  tagsEl.innerHTML = tags.length === 0 ? '' : tags.map((t, i) =>
    (i > 0 ? '<span class="summary-and">and</span>' : '') +
    `<span class="summary-tag" style="color:${t.color};border-color:${t.color};">${t.label}</span>`
  ).join('');
}

// Topic: multi-select
document.querySelectorAll('.topic-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const topic = btn.dataset.topic;
    if (topic === 'all') {
      activeTopics = new Set(['all']);
      document.querySelectorAll('.topic-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    } else {
      activeTopics.delete('all');
      document.querySelector('.topic-btn[data-topic="all"]').classList.remove('active');
      if (activeTopics.has(topic)) {
        activeTopics.delete(topic);
        btn.classList.remove('active');
      } else {
        activeTopics.add(topic);
        btn.classList.add('active');
      }
      if (activeTopics.size === 0) {
        activeTopics.add('all');
        document.querySelector('.topic-btn[data-topic="all"]').classList.add('active');
      }
    }
    applyFilters();
  });
});

// Type: single-select with toggle off
document.querySelectorAll('.type-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const alreadyActive = btn.classList.contains('active');
    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
    if (alreadyActive) {
      activeType = 'all';
      document.querySelector('.type-btn[data-type="all"]').classList.add('active');
    } else {
      btn.classList.add('active');
      activeType = btn.dataset.type;
    }
    applyFilters();
  });
});

// First author: toggle
document.querySelector('.first-author-btn').addEventListener('click', function() {
  filterFirstAuthor = !filterFirstAuthor;
  this.classList.toggle('active', filterFirstAuthor);
  applyFilters();
});

loadPublications();
</script>
</body>
</html>
